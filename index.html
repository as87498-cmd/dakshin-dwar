<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>दक्षिण द्वार | Dakshin Dwar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f3d26;
      --primary-light: #1b5e3b;
      --gold: #d4af37;
      --gold-dark: #b8911c;
      --gold-light: #fef7dc;
      --bg: #f5f2eb;
      --card-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --veg: #138808;
      --wa: #25d366;
      --wa-dark: #128c7e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 120px; }

    /* SPLASH SCREEN (2.5 Sec Auto Hide) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #174d32 0%, #082417 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      padding: 20px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .splash-card {
      background: #fffdf5;
      border: 3px solid var(--gold);
      border-radius: 28px;
      padding: 32px 20px 24px;
      max-width: 350px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .splash-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f7e6be;
      font-weight: 800;
      font-size: 22px;
    }
    .splash-welcome { font-size: 11px; letter-spacing: 3px; font-weight: 700; color: #a17724; text-transform: uppercase; margin-bottom: 4px; }
    .splash-title-hi { font-family: 'Yatra One', cursive; font-size: 32px; color: var(--primary); line-height: 1.2; }
    .splash-title-en { font-size: 15px; font-weight: 800; color: #a17724; letter-spacing: 2px; margin-top: 2px; }
    .splash-divider { width: 50px; height: 2px; background: var(--gold); margin: 12px auto; }
    .thali-svg { width: 100%; max-width: 260px; height: auto; margin: 8px auto 12px; display: block; }
    .splash-tagline { font-size: 13px; color: #4b5563; font-weight: 600; }
    .loader-dots { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1s infinite alternate; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.1); } }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #092617 0%, #174d32 100%);
      color: #fffdf5;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .header-content { max-width: 600px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    .brand-title { font-family: 'Yatra One', cursive; font-size: 24px; color: #fff9e6; }
    .brand-sub { font-size: 11px; color: var(--gold); font-weight: 600; letter-spacing: 1px; }
    .pure-veg-tag {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(212,175,55,0.5);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #d1fae5;
    }
    .veg-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; }

    /* CONTROLS (TABLE & SEARCH) */
    .controls { max-width: 600px; margin: 12px auto 0; padding: 0 14px; }
    .table-box {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid #e5e7eb;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .table-box span { font-size: 13px; font-weight: 700; color: var(--primary); white-space: nowrap; }
    .table-box input { border: none; outline: none; width: 100%; font-size: 14px; font-weight: 600; }
    .search-box {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid #e5e7eb;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .search-box input { border: none; outline: none; width: 100%; font-size: 13.5px; }

    /* CATEGORY PILLS */
    .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 14px 4px;
      max-width: 600px;
      margin: auto;
      scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-pill {
      white-space: nowrap;
      border: none;
      background: #e5e0d3;
      color: #374151;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .cat-pill.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(15,61,38,0.25);
    }

    /* MENU ITEMS */
    .menu-wrap { max-width: 600px; margin: auto; padding: 0 14px; }
    .sec-heading {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-heading::after { content: ''; flex: 1; height: 1px; background: #d1c7b7; }
    .menu-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #eee8dc;
    }
    .item-info { flex: 1; padding-right: 12px; }
    .veg-symbol {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--veg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      margin-bottom: 4px;
    }
    .veg-symbol::after { content: ''; width: 6px; height: 6px; background: var(--veg); border-radius: 50%; }
    .item-title { font-size: 14.5px; font-weight: 700; color: #111827; }
    .item-rate { font-size: 15px; font-weight: 800; color: var(--primary); margin-top: 3px; }

    /* ADD & QUANTITY BUTTONS */
    .btn-add {
      background: #ffffff;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 20px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15,61,38,0.08);
    }
    .qty-wrap {
      display: none;
      align-items: center;
      background: var(--primary);
      border-radius: 20px;
      padding: 2px 4px;
      box-shadow: 0 3px 8px rgba(15,61,38,0.25);
    }
    .q-btn {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .q-num { min-width: 22px; text-align: center; color: #ffffff; font-weight: 700; font-size: 13.5px; }

    /* BOTTOM CART BAR */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      padding: 12px 16px;
      box-shadow: 0 -4px 18px rgba(0,0,0,0.08);
      z-index: 1000;
      display: none;
    }
    .cart-bar-inner {
      max-width: 600px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cart-meta .count { font-size: 12px; color: var(--muted); font-weight: 600; }
    .cart-meta .total { font-size: 18px; font-weight: 800; color: var(--primary); }
    .btn-order {
      background: var(--wa);
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      border-radius: 26px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37,211,102,0.35);
    }
  </style>
</head>
<body>

  <!-- 1. SPLASH SCREEN (Built-in Image) -->
  <div id="splash-screen">
    <div class="splash-card">
      <div class="splash-logo">द द्व</div>
      <div class="splash-welcome">WELCOME TO</div>
      <div class="splash-title-hi">दक्षिण द्वार</div>
      <div class="splash-title-en">DAKSHIN DWAR</div>
      <div class="splash-divider"></div>

      <!-- Inbuilt Vector Art of South Indian Thali -->
      <svg class="thali-svg" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="200" cy="115" rx="190" ry="95" fill="#2e7d32" stroke="#1b5e20" stroke-width="3" />
        <line x1="30" y1="115" x2="370" y2="115" stroke="#43a047" stroke-width="2.5" />
        <polygon points="70,105 330,85 315,115 60,135" fill="#e5a63b" stroke="#b07212" stroke-width="2" />
        <line x1="130" y1="100" x2="120" y2="125" stroke="#9a5d07" stroke-width="2" opacity="0.6"/>
        <line x1="190" y1="95" x2="180" y2="120" stroke="#9a5d07" stroke-width="2" opacity="0.6"/>
        <line x1="250" y1="90" x2="240" y2="115" stroke="#9a5d07" stroke-width="2" opacity="0.6"/>
        <ellipse cx="90" cy="155" rx="28" ry="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <ellipse cx="140" cy="158" rx="28" ry="24" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" />
        <circle cx="205" cy="158" r="24" fill="#c87d28" stroke="#874807" stroke-width="2" />
        <circle cx="205" cy="158" r="8" fill="#2e7d32" stroke="#874807" stroke-width="1.5" />
        <circle cx="265" cy="155" r="18" fill="#ffffff" stroke="#d4af37" stroke-width="2" />
        <circle cx="310" cy="150" r="18" fill="#d32f2f" stroke="#d4af37" stroke-width="2" />
        <circle cx="355" cy="138" r="20" fill="#e65100" stroke="#d4af37" stroke-width="2" />
      </svg>

      <div class="splash-tagline">Authentic South Indian Flavours</div>
      <div class="loader-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <!-- 2. HEADER -->
  <header>
    <div class="header-content">
      <div>
        <div class="brand-title">दक्षिण द्वार</div>
        <div class="brand-sub">DAKSHIN DWAR • PURE VEG</div>
      </div>
      <div class="pure-veg-tag">
        <div class="veg-dot"></div>
        100% Pure Veg
      </div>
    </div>
  </header>

  <!-- 3. TABLE NO & SEARCH -->
  <div class="controls">
    <div class="table-box">
      <span>Table No:</span>
      <input type="text" id="tableNo" placeholder="Yahan table number dalein (jaise 3, 5)">
    </div>
    <div class="search-box">
      <input type="text" id="searchBox" placeholder="Search dish (e.g. Masala Dosa, Idli, Coffee...)" onkeyup="filterItems()">
    </div>
  </div>

  <!-- 4. CATEGORY PILLS -->
  <div class="cat-bar" id="catBar"></div>

  <!-- 5. MENU LIST -->
  <div class="menu-wrap" id="menuWrap"></div>

  <!-- 6. BOTTOM ORDER BAR -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-inner">
      <div class="cart-meta">
        <div class="count"><span id="cartCount">0</span> items selected</div>
        <div class="total" id="cartTotal">₹0</div>
      </div>
      <button class="btn-order" onclick="placeOrder()">Place Order (WhatsApp)</button>
    </div>
  </div>

  <script>
    // 2.5 Second ke baad Welcome Screen automatic hide ho jayegi
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0';
      splash.style.visibility = 'hidden';
    }, 2500);

    const menu = [
      {
        category: "Best Sellers",
        items: [
          { name: "Madurai Ghee Roast Dosa", price: 250 },
          { name: "Benne Dosa", price: 190 },
          { name: "Rava Masala Dosa", price: 190 },
          { name: "Ghee Podi Masala Dosa", price: 190 },
          { name: "Dakshin Dwar Special", price: 265 },
          { name: "Open Butter Masala Dosa", price: 180 },
          { name: "Pizza Dosa", price: 265 }
        ]
      },
      {
        category: "Dosa",
        items: [
          { name: "Plain Dosa", price: 105 },
          { name: "Masala Dosa", price: 145 },
          { name: "Paper Plain Dosa", price: 185 },
          { name: "Paper Masala Dosa", price: 215 },
          { name: "Onion Masala Dosa", price: 160 },
          { name: "Rava Plain Dosa", price: 170 },
          { name: "Onion Rava Masala Dosa", price: 215 },
          { name: "Set Dosa (3 Pcs)", price: 170 },
          { name: "Mysore Masala Dosa", price: 170 },
          { name: "Cheese Mysore Masala Dosa", price: 215 },
          { name: "Cheese Plain Dosa", price: 180 },
          { name: "Cheese Masala Dosa", price: 205 },
          { name: "Paneer Masala Dosa", price: 190 },
          { name: "Jali Masala Dosa", price: 180 },
          { name: "Banglore Spicy Dosa", price: 170 },
          { name: "Kal Dosa", price: 180 },
          { name: "Jini Dosa", price: 215 },
          { name: "Loni Spong Dosa", price: 170 },
          { name: "Mint Podi Masala Dosa", price: 180 },
          { name: "Curry Leaves Podi Dosa", price: 180 },
          { name: "Garlic Ghee Roast Dosa", price: 210 },
          { name: "Malleshwaram Dosa", price: 240 }
        ]
      },
      {
        category: "Uttapam",
        items: [
          { name: "Plain Uttapam", price: 105 },
          { name: "Onion Uttapam", price: 115 },
          { name: "Tomato Uttapam", price: 115 },
          { name: "Tomato Onion Uttapam", price: 125 },
          { name: "Mix Veg Uttapam", price: 135 },
          { name: "Spicy Vegetable Uttapam", price: 135 },
          { name: "Paneer Masala Uttapam", price: 150 },
          { name: "Cheese Burst Uttapam", price: 160 }
        ]
      },
      {
        category: "Idli",
        items: [
          { name: "Classic Idli (2 Pcs)", price: 95 },
          { name: "Button Idli (10 Pcs)", price: 95 },
          { name: "Masala Button Idli (10 Pcs)", price: 125 },
          { name: "Fried Idli (Deep Fry)", price: 100 },
          { name: "Ghee Podi Thatte Idli", price: 115 },
          { name: "Idli Chat (6 Pcs)", price: 70 },
          { name: "Idli - Vada Mix", price: 95 },
          { name: "Dahi Idli (1 Pcs)", price: 80 }
        ]
      },
      {
        category: "Vada",
        items: [
          { name: "Medu Vada (2 Pcs)", price: 95 },
          { name: "Dahi Vada (1 Pcs)", price: 80 }
        ]
      },
      {
        category: "Desserts & Beverages",
        items: [
          { name: "Pineapple Rava Kesari", price: 125 },
          { name: "Filter Coffee", price: 55 }
        ]
      },
      {
        category: "Extras",
        items: [
          { name: "Extra Ghee", price: 35 },
          { name: "Extra Masala", price: 35 },
          { name: "Extra Cheese", price: 35 },
          { name: "Extra Paneer", price: 35 }
        ]
      }
    ];

    const cart = {};
    let curCategory = "All";

    function makeCatBar() {
      const bar = document.getElementById('catBar');
      bar.innerHTML = `<button class="cat-pill active" onclick="pickCategory('All', this)">All</button>`;
      menu.forEach(c => {
        bar.innerHTML += `<button class="cat-pill" onclick="pickCategory('${c.category}', this)">${c.category}</button>`;
      });
    }

    function pickCategory(c, btn) {
      curCategory = c;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu();
    }

    function safeId(str) {
      return str.replace(/[^a-zA-Z0-9]/g, '_');
    }

    function renderMenu() {
      const container = document.getElementById('menuWrap');
      const search = document.getElementById('searchBox').value.toLowerCase().trim();
      container.innerHTML = '';

      menu.forEach(cat => {
        if (curCategory !== "All" && curCategory !== cat.category) return;
        const matched = cat.items.filter(i => i.name.toLowerCase().includes(search));
        if (matched.length === 0) return;

        const heading = document.createElement('div');
        heading.className = 'sec-heading';
        heading.innerText = cat.category;
        container.appendChild(heading);

        matched.forEach(item => {
          const qty = cart[item.name]?.qty || 0;
          const sid = safeId(item.name);
          const card = document.createElement('div');
          card.className = 'menu-card';
          card.innerHTML = `
            <div class="item-info">
              <div class="veg-symbol"></div>
              <div class="item-title">${item.name}</div>
              <div class="item-rate">₹${item.price}</div>
            </div>
            <div>
              <button class="btn-add" id="add-${sid}" style="display: ${qty > 0 ? 'none' : 'block'}" onclick="updateItem('${item.name}', ${item.price}, 1)">ADD +</button>
              <div class="qty-wrap" id="box-${sid}" style="display: ${qty > 0 ? 'flex' : 'none'}">
                <button class="q-btn" onclick="updateItem('${item.name}', ${item.price}, -1)">−</button>
                <span class="q-num" id="num-${sid}">${qty}</span>
                <button class="q-btn" onclick="updateItem('${item.name}', ${item.price}, 1)">+</button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    function updateItem(name, price, delta) {
      if (!cart[name]) cart[name] = { qty: 0, price: price };
      cart[name].qty += delta;
      if (cart[name].qty < 0) cart[name].qty = 0;

      const q = cart[name].qty;
      const sid = safeId(name);
      const addBtn = document.getElementById(`add-${sid}`);
      const box = document.getElementById(`box-${sid}`);
      const num = document.getElementById(`num-${sid}`);

      if (addBtn && box && num) {
        if (q > 0) {
          addBtn.style.display = 'none';
          box.style.display = 'flex';
          num.innerText = q;
        } else {
          addBtn.style.display = 'block';
          box.style.display = 'none';
        }
      }
      refreshCart();
    }

    function refreshCart() {
      let grandTotal = 0;
      let count = 0;
      for (let k in cart) {
        if (cart[k].qty > 0) {
          grandTotal += cart[k].qty * cart[k].price;
          count += cart[k].qty;
        }
      }
      const cartBar = document.getElementById('cartBar');
      if (count > 0) {
        cartBar.style.display = 'block';
        document.getElementById('cartCount').innerText = count;
        document.getElementById('cartTotal').innerText = `₹${grandTotal}`;
      } else {
        cartBar.style.display = 'none';
      }
    }

    function filterItems() {
      renderMenu();
    }

    function placeOrder() {
      const table = document.getElementById('tableNo').value.trim() || "Not Mentioned";
      let list = [];
      let total = 0;

      for (let k in cart) {
        if (cart[k].qty > 0) {
          const c = cart[k].qty * cart[k].price;
          total += c;
          list.push(`• ${k}  x${cart[k].qty} = ₹${c}`);
        }
      }

      if (list.length === 0) {
        alert("Kripya kam se kam ek item select karein.");
        return;
      }

      const msg = 
        `🛎️ *NEW ORDER - DAKSHIN DWAR*\n` +
        `📍 *Table No:* ${table}\n` +
        `---------------------------\n` +
        list.join('\n') + `\n` +
        `---------------------------\n` +
        `💰 *Grand Total: ₹${total}*\n` +
        `---------------------------`;

      // Customer ka order seedhe is WhatsApp number par open hoga
      const targetPhone = "919755746183";
      window.location.href = `https://wa.me/${targetPhone}?text=${encodeURIComponent(msg)}`;
    }

    makeCatBar();
    renderMenu();
  </script>
</body>
</html>
